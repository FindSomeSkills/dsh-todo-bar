<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    padding: 20px;
    display: inline-block;
  }
  .card {
    width: 360px;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    background: #ffffff;
    color: #1a1a1a;
    font-size: 13px;
    line-height: 1.55;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .12);
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: #f6f6f6;
    border-bottom: 1px solid #e3e3e3;
    user-select: none;
  }
  .grip {
    width: 10px;
    height: 14px;
    flex: 0 0 auto;
    opacity: .45;
    background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
    background-size: 4px 4px;
  }
  .title { font-weight: 600; font-size: 13px; }
  .sub { color: #737373; font-size: 11px; }
  .grow { flex: 1; }
  .chev { color: #737373; font-size: 14px; }
  .body { padding: 8px 10px 10px; }
  .sched {
    padding: 6px 8px;
    border-radius: 6px;
    background: #f2f2f2;
    border: 1px solid #e3e3e3;
    margin-bottom: 8px;
  }
  .sched-head {
    color: #737373;
    font-size: 10px;
    letter-spacing: .04em;
    margin-bottom: 3px;
  }
  .sched-row { display: flex; gap: 7px; align-items: baseline; padding: 1px 0; }
  .sched-time {
    flex: 0 0 auto;
    color: #247bbf;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .sched-title { flex: 1; font-size: 12px; }
  .sched-foot {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid #e3e3e3;
    color: #737373;
    font-size: 10px;
  }
  ul { list-style: none; }
  li { display: flex; align-items: flex-start; gap: 7px; padding: 2px 0; }
  .box {
    width: 13px;
    height: 13px;
    margin-top: 3px;
    flex: 0 0 auto;
    border: 1.5px solid #999;
    border-radius: 3px;
  }
  .due {
    flex: 0 0 auto;
    width: 44px;
    color: #737373;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  .text { flex: 1; word-break: break-word; }
  .x { color: #b3b3b3; font-size: 14px; line-height: 1; padding: 0 3px; }
  .foot { display: flex; gap: 6px; margin-top: 7px; align-items: center; }
  .btn {
    border: 1px solid #e3e3e3;
    border-radius: 6px;
    padding: 2px 8px;
    color: #737373;
    font-size: 11px;
  }
  .mark { margin-left: auto; color: #737373; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="bar">
    <span class="grip"></span>
    <span class="title">2026-11-24</span>
    <span class="sub">周二</span>
    <span class="sub">· 2 项没做完</span>
    <span class="grow"></span>
    <span class="chev">▾</span>
  </div>
  <div class="body">
    <div class="sched">
      <div class="sched-head">计划任务 · 只读</div>
      <div class="sched-row">
        <span class="sched-time">09:30</span>
        <span class="sched-title">向 GSC 和 Bing 提交本次改动的 14 个网址</span>
      </div>
      <div class="sched-row">
        <span class="sched-time">10:00</span>
        <span class="sched-title">提醒：Proofbound 收尾（改写 Bing 验证）</span>
      </div>
      <div class="sched-foot">共 10 个自动化任务 · 下一个 11-25 20:00 发 Reddit 外链</div>
    </div>
    <ul>
      <li>
        <span class="box"></span>
        <span class="due">09:30</span>
        <span class="text">提交 GSC 10 条</span>
        <span class="x">×</span>
      </li>
      <li>
        <span class="box"></span>
        <span class="due"></span>
        <span class="text">买牛奶</span>
        <span class="x">×</span>
      </li>
    </ul>
    <div class="foot">
      <span class="btn">+ 一条</span>
      <span class="btn">清掉已完成</span>
      <span class="mark">dsh-todo-bar</span>
    </div>
  </div>
</div>
</body>
</html>
